name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  benchmark-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s Plank.Benchmarks/scripts/tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test Plank.Benchmarks/scripts/tests/s3-footer.test.cjs

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --solution Plank-Lab.sln --configuration Release

  pqmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with numpy --with pyarrow --with duckdb --with thriftpy2 --with pytest python -m pytest pqmin/tests -q
