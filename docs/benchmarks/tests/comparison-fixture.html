<!doctype html><meta charset="utf-8"><iframe src="../../index.html?embed=docs"></iframe><p id="result">pending</p>
<script>
(async()=>{const frame=document.querySelector('iframe');const result=document.querySelector('#result');const check=(condition,message)=>{if(!condition)throw new Error(message)};try{await new Promise(resolve=>frame.onload=resolve);const doc=frame.contentDocument;await new Promise(resolve=>{const poll=setInterval(()=>{if(doc.querySelector('.pc-scenario-cell')){clearInterval(poll);resolve()}},20)});check(doc.querySelectorAll('.pc-cpus input').length===7,'all CPUs');check(!doc.querySelector('details.pc-matrix'),'matrix always visible');check(!doc.querySelector('[data-relative-lib]'),'fixed Plank comparison');const report=await(await fetch('../write-ryzen-9-7900x-v1.json')).json();const c=report.suites.find(s=>s.id==='real-world').cases.find(c=>c.label==='Complete taxi file'&&c.encoding==='plain'&&c.workload==='row');const median=m=>{const values=[...m.samplesMilliseconds].sort((a,b)=>a-b);return(values[49]+values[50])/2};const plank=median(c.measurements.find(m=>m.implementationId==='plank-single'));const alternative=Math.min(...c.measurements.filter(m=>['parquetsharp-single','parquetnet-single'].includes(m.implementationId)&&m.available).map(median));check(doc.querySelector('.pc-scenario-cell').textContent==='+'+Math.round((alternative/plank-1)*100)+'%','Plank ratio');check([...doc.querySelectorAll('[data-chart] path')].every(p=>p.getAttribute('stroke-dasharray')===''),'one CPU solid');doc.querySelector('input[value="xeon-e-2288g"]').click();check(doc.querySelectorAll('[data-chart] path').length===6,'multiple CPU graph');doc.querySelector('[data-view="bars"]').click();check(doc.querySelectorAll('.pc-bar-row').length===6,'median bars');doc.querySelectorAll('.pc-cpus input:checked').forEach(i=>i.click());check(doc.querySelector('[data-missing]').textContent.includes('Select at least'),'empty selection');result.textContent='passed';}catch(error){result.textContent='failed: '+error.message}})();
</script>
