<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plank Lab benchmark matrix</title>
  <script>
    if (new URLSearchParams(location.search).get("embed") === "docs")
      document.documentElement.dataset.embedded = "true";
  </script>
  <link rel="stylesheet" href="benchmarks/write-benchmarks-v16.css?v=2">
</head>
<body>
  <main>
    <header class="benchmark-standalone">
      <h1>Plank Lab benchmark matrix</h1>
      <p><strong>Experimental data and tooling.</strong> Results are not a support or stability guarantee.</p>
      <p><a href="s3-footer.html">S3 footer benchmark: request timelines and file ranges</a></p>
    </header>
    <div id="write-benchmarks" class="write-benchmarks" data-machines="benchmarks/machines-v1.json">
      <p class="benchmark-loading" role="status">Loading benchmark results…</p>
    </div>
  </main>
  <script src="benchmarks/write-benchmarks-v16.js?v=2" defer></script>
  <script>
    if (document.documentElement.dataset.embedded === "true") {
      const root = document.documentElement;

      window.addEventListener("message", event => {
        if (event.source !== parent || event.data?.type !== "plank-benchmarks-theme") return;

        root.dataset.bsTheme = event.data.theme === "dark" ? "dark" : "light";
        const styles = event.data.styles ?? {};
        const variables = {
          "--bs-body-color": styles.color,
          "--bs-body-bg": styles.backgroundColor,
          "--bs-secondary-color": styles.secondaryColor,
          "--bs-border-color": styles.borderColor,
          "--docs-font-family": styles.fontFamily,
          "--docs-font-size": styles.fontSize,
          "--docs-line-height": styles.lineHeight
        };

        for (const [name, value] of Object.entries(variables))
          if (value) root.style.setProperty(name, value);
      });

      const reportHeight = () => parent.postMessage({
        type: "plank-benchmarks-resize",
        height: document.documentElement.scrollHeight
      }, location.origin);

      new ResizeObserver(reportHeight).observe(document.body);
      window.addEventListener("load", reportHeight);
      parent.postMessage({ type: "plank-benchmarks-ready" }, location.origin);
    }
  </script>
</body>
</html>
